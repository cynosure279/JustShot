# GitHub Actions CI/CD for JustShot
#
# Job 1: Build the justshot binary (needs libjustcapture subproject from GitHub).
# Job 2: Build the phosh quick-setting plugin (needs phosh with -Dbindings-lib=true).
#
name: Build JustShot

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-binary:
    name: Build justshot binary
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm meson ninja gcc pkg-config git \
            glib2 gdk-pixbuf2 gtk4 libadwaita cairo

      - name: Build justshot
        run: |
          meson setup builddir -Dtests=false -Dphosh-plugin=false
          ninja -C builddir

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: justshot-binary
          path: builddir/src/justshot
          if-no-files-found: error

  build-plugin:
    name: Build phosh plugin
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build phosh plugin
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm meson ninja gcc pkg-config git cmake patch \
            glib2 glib2-devel gtk3 gtk4 libhandy libadwaita \
            wayland wayland-protocols libxkbcommon \
            libgudev networkmanager libpulse upower libsoup3 \
            gnome-desktop feedbackd libgmobile json-glib \
            modemmanager polkit libsecret gcr gnome-bluetooth-3.0 \
            fribidi systemd-libs appstream evolution-data-server \
            qrcodegen libical gsettings-desktop-schemas \
            python-docutils cairo pango gdk-pixbuf2 dconf \
            callaudiod libsysprof-capture \
            gobject-introspection gobject-introspection-runtime \
            evince
          # Clone and build phosh with bindings-lib=true
          git clone --depth 1 --branch v0.57.0 https://gitlab.gnome.org/World/Phosh/phosh.git /tmp/phosh
          git clone --depth 1 --branch v0.1.5 https://gitlab.gnome.org/World/Phosh/libcall-ui.git /tmp/phosh/subprojects/libcall-ui
          git clone --depth 1 https://gitlab.gnome.org/guidog/libgnome-volume-control.git /tmp/phosh/subprojects/gvc
          cd /tmp/phosh
          # Apply libical-4 compatibility patch
          curl -sL 'https://gitlab.archlinux.org/archlinux/packaging/packages/phosh/-/raw/main/libical-4.patch' | patch -p1
          meson setup builddir --prefix=/usr --libdir=lib --libexecdir=lib/phosh \
            -Dbindings-lib=true -Dtests=false -Dphoc_tests=disabled -Dtools=false \
            -Dman=false -Dgtk_doc=false -Dintrospection=false -Dvapi=false \
            -Dcallui-i18n=false -Dsearchd=false
          ninja -C builddir
          ninja -C builddir install
          # Build the plugin
          cd $GITHUB_WORKSPACE/plugins/justshot-quick-setting
          meson setup builddir --prefix=/usr --libdir=lib
          ninja -C builddir

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: justshot-plugin
          path: |
            plugins/justshot-quick-setting/builddir/*.so
            plugins/justshot-quick-setting/builddir/*.plugin
          if-no-files-found: error

  release:
    needs: [build-binary, build-plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
